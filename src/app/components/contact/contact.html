<section id="contact" class="seccion-completa" style="background: var(--fondo); position: relative; overflow: hidden;">
  <div style="text-align: center; margin-bottom: 50px;">
    <span class="seccion-etiqueta">Estamos a tu Disposición</span>
    <h2 class="seccion-titulo">Contacto & Ubicación</h2>
    <div class="linea-dorada centrada"></div>
  </div>

  <div style="max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: start;">
    
    <!-- Mapa y Botón Reserva -->
    <div class="contacto-mapa reveal" style="border-radius: 4px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); background: #fff; padding: 15px;">
      <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3826.963162788547!2d-89.89735492476566!3d16.9209709849503!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8f5fbbe74b834fc3%3A0xeebd58e8ea6c4a86!2sMayanza%20Grand%20Hotels!5e0!3m2!1ses!2sgt!4v1700000000000!5m2!1ses!2sgt" 
              width="100%" 
              height="350" 
              style="border:0; border-radius: 4px;" 
              allowfullscreen="" 
              loading="lazy" 
              referrerpolicy="no-referrer-when-downgrade">
      </iframe>
      
      <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(166,128,49,0.2); padding-top: 20px;">
        <div>
          <h4 style="font-family: var(--fuente-titulo); font-size: 1.1rem; color: var(--texto-oscuro);">Reserva tu Estancia</h4>
          <p style="font-size: 0.8rem; color: var(--texto-gris);">Garantizamos el mejor precio en línea.</p>
        </div>
        <button class="btn-primario" (click)="scrollToBooking()">Reservar Ahora</button>
      </div>
    </div>

    <!-- Formulario de Contacto -->
    <div class="contacto-form-wrapper reveal reveal-delay-2" style="background: #fff; padding: 40px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.05);">
      <h3 style="font-family: var(--fuente-titulo); font-size: 1.5rem; margin-bottom: 25px;">Envíanos un Mensaje</h3>
      <form (submit)="sendEmail($event)">
        <div class="form-grupo" style="margin-bottom: 20px;">
          <label class="form-label" style="display:block; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; color: var(--texto-gris); text-transform: uppercase;">Nombre Completo</label>
          <input type="text" [(ngModel)]="formData.nombre" name="nombre" required style="width: 100%; padding: 12px; border: 1px solid rgba(166,128,49,0.3); border-radius: 0; font-family: var(--fuente-cuerpo); font-size: 0.9rem;" placeholder="Tu nombre">
        </div>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
          <div class="form-grupo">
            <label class="form-label" style="display:block; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; color: var(--texto-gris); text-transform: uppercase;">Correo Electrónico</label>
            <input type="email" [(ngModel)]="formData.email" name="email" required style="width: 100%; padding: 12px; border: 1px solid rgba(166,128,49,0.3); border-radius: 0; font-family: var(--fuente-cuerpo); font-size: 0.9rem;" placeholder="Tu correo">
          </div>
          <div class="form-grupo">
            <label class="form-label" style="display:block; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; color: var(--texto-gris); text-transform: uppercase;">Teléfono</label>
            <input type="tel" [(ngModel)]="formData.telefono" name="telefono" style="width: 100%; padding: 12px; border: 1px solid rgba(166,128,49,0.3); border-radius: 0; font-family: var(--fuente-cuerpo); font-size: 0.9rem;" placeholder="Tu teléfono">
          </div>
        </div>
        
        <div class="form-grupo" style="margin-bottom: 30px;">
          <label class="form-label" style="display:block; margin-bottom: 8px; font-size: 0.8rem; letter-spacing: 1px; color: var(--texto-gris); text-transform: uppercase;">Mensaje / Consultas</label>
          <textarea [(ngModel)]="formData.mensaje" name="mensaje" required style="width: 100%; padding: 12px; border: 1px solid rgba(166,128,49,0.3); border-radius: 0; min-height: 120px; font-family: var(--fuente-cuerpo); font-size: 0.9rem; resize: vertical;" placeholder="¿En qué podemos ayudarte?"></textarea>
        </div>
        
        <button type="submit" class="btn-primario" style="width: 100%;" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Enviando...' : 'Enviar Mensaje & Generar Check-in QR' }}
        </button>
      </form>
    </div>

  </div>
</section>
